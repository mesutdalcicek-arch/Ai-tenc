name: Build APK (Debug Mode)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip openjdk-17-jdk \
          autoconf libtool libffi-dev libssl-dev \
          pkg-config cmake ninja-build zlib1g-dev \
          libncurses5-dev
    
    - name: Install buildozer
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython virtualenv
    
    - name: Pre-build checks
      run: |
        echo "=== Environment Check ==="
        python --version
        pip --version
        java -version
        buildozer --version
        echo ""
        echo "=== buildozer.spec ==="
        cat buildozer.spec
        echo ""
        echo "=== Project structure ==="
        find . -maxdepth 2 -type f -name "*.py" | head -20
    
    - name: Build APK (verbose + log to file)
      run: |
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        buildozer -v android debug 2>&1 | tee build_log.txt
      env:
        ANDROID_HOME: /usr/lib/android-sdk
      continue-on-error: true
    
    - name: Analyze build log
      if: always()
      run: |
        echo "=== Build Log Analysis ==="
        if [ -f build_log.txt ]; then
          echo "Log file size: $(wc -l < build_log.txt) lines"
          echo ""
          echo "=== Last 100 lines ==="
          tail -n 100 build_log.txt
          echo ""
          echo "=== Error patterns ==="
          grep -i "error\|fail\|exception\|traceback" build_log.txt | tail -n 20 || echo "No obvious errors found"
          echo ""
          echo "=== Command failures ==="
          grep -A 5 "Command failed:" build_log.txt | tail -n 30 || echo "No command failures"
        else
          echo "No build_log.txt found"
        fi
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ai-forge-apk
        path: bin/*.apk
    
    - name: Create Release
      if: success() && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
