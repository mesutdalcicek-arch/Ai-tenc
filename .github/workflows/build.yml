name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        pip install buildozer cython
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool libffi-dev libssl-dev
    
    - name: Build APK
      run: buildozer android debug
      env:
        ANDROID_HOME: /usr/lib/android-sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-forge-apk
        path: bin/*.apk
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
